name: PR checks

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned mise tools
        uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
        with:
          version: 2026.8.11

      - name: Install the locked simulator environment
        run: mise run simulator:setup

      - name: Download pinned gateway dependencies
        run: mise run gateway:setup

      - name: Run repository checks and tests
        run: mise run hooks:check

      - name: Verify local broker startup and persistence
        run: mise run infra:test

      - name: Verify gateway MQTT delivery and recovery
        run: mise run gateway:test:integration
