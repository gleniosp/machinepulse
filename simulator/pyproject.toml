[project]
authors = [
    { name = "gleniosp", email = "11273108+gleniosp@users.noreply.github.com" },
]
dependencies = ["pydantic>=2.11,<3"]
name = "machinepulse-simulator"
version = "0.1.0"
description = "Deterministic synthetic telemetry simulator for MachinePulse"
requires-python = ">=3.13,<3.14"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.13,<3.14"

[tool.pixi.pypi-dependencies]
machinepulse_simulator = { path = ".", editable = true }

[tool.pixi.feature.dev.pypi-dependencies]
mypy = ">=1.14,<2"
pytest = ">=8,<10"
ruff = ">=0.14,<0.15"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tool.pixi.feature.dev.tasks]
format = "ruff format src tests"
format-check = "ruff format --check src tests"
lint = "ruff check src tests"
test = "pytest"
typecheck = "mypy src tests"

[tool.hatch.build.targets.wheel]
packages = ["src/machinepulse_simulator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
exclude = [".pixi"]
line-length = 88
indent-width = 4
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = []
fixable = ["ALL"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
explicit_package_bases = true
mypy_path = "src"
python_version = "3.13"
strict = true
