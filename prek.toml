default_install_hook_types = ["pre-commit", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-case-conflict" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = [
    "--maxkb=1024",
  ] },
]

[[repos]]
repo = "local"

[[repos.hooks]]
id = "fix"
name = "repository fixes and checks"
language = "system"
entry = "mise run fix"
always_run = true
pass_filenames = false
stages = ["pre-commit"]

[[repos.hooks]]
id = "commit-check"
name = "Conventional Commit message"
language = "system"
entry = "mise run commit:check"
stages = ["commit-msg"]
