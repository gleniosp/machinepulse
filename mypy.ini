# Shared strict type-checking policy; paths are relative to this file.
[mypy]
python_version = 3.13
strict = true
explicit_package_bases = true
mypy_path = $MYPY_CONFIG_FILE_DIR/tools/simulator/src,$MYPY_CONFIG_FILE_DIR/tools/simulator
files = tools/simulator/src,tools/simulator/tests,tools/simulator/experiments,infra/docker
