[project]
authors = [{ name = "gleniosp", email = "11273108+gleniosp@users.noreply.github.com" }]
dependencies = ["pydantic>=2.11,<3"]
name = "machinepulse-simulator"
version = "0.1.0"
description = "Deterministic synthetic telemetry simulator for MachinePulse"
requires-python = ">=3.13,<3.14"

[project.scripts]
machinepulse-sim = "machinepulse_simulator.cli:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/machinepulse_simulator"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
