min_version = "2026.8.11"
monorepo_root = true

[monorepo]
config_roots = ["tools/simulator", "services/telemetry-gateway"]
lockfile = true

[tools]
github-cli = "2.98.0"
go = "1.27.1"
prek = "0.5.3"
pixi = "0.76.1"

# Read local defaults with mise's dotenv parser. Map supported variables back
# into the environment while preserving caller-supplied values, even empty ones.
# The path is relative to this config, including from nested project tasks.
[vars]
_.file = ".env"

[env]
MACHINEPULSE_MQTT_ADDRESS = "{{ get_env(name='MACHINEPULSE_MQTT_ADDRESS', default=vars.MACHINEPULSE_MQTT_ADDRESS | default(value='')) }}"
MACHINEPULSE_MQTT_CLIENT_ID = "{{ get_env(name='MACHINEPULSE_MQTT_CLIENT_ID', default=vars.MACHINEPULSE_MQTT_CLIENT_ID | default(value='')) }}"
MACHINEPULSE_MQTT_PORT = "{{ get_env(name='MACHINEPULSE_MQTT_PORT', default=vars.MACHINEPULSE_MQTT_PORT | default(value='')) }}"
MACHINEPULSE_KAFKA_PORT = "{{ get_env(name='MACHINEPULSE_KAFKA_PORT', default=vars.MACHINEPULSE_KAFKA_PORT | default(value='')) }}"
MACHINEPULSE_MQTT_SESSION_EXPIRY_SECONDS = "{{ get_env(name='MACHINEPULSE_MQTT_SESSION_EXPIRY_SECONDS', default=vars.MACHINEPULSE_MQTT_SESSION_EXPIRY_SECONDS | default(value='')) }}"
MACHINEPULSE_MQTT_RECONNECT_CAP = "{{ get_env(name='MACHINEPULSE_MQTT_RECONNECT_CAP', default=vars.MACHINEPULSE_MQTT_RECONNECT_CAP | default(value='')) }}"
MACHINEPULSE_MQTT_MAX_PACKET_BYTES = "{{ get_env(name='MACHINEPULSE_MQTT_MAX_PACKET_BYTES', default=vars.MACHINEPULSE_MQTT_MAX_PACKET_BYTES | default(value='')) }}"
MACHINEPULSE_GATEWAY_OPERATION_TIMEOUT = "{{ get_env(name='MACHINEPULSE_GATEWAY_OPERATION_TIMEOUT', default=vars.MACHINEPULSE_GATEWAY_OPERATION_TIMEOUT | default(value='')) }}"

[tasks.setup]
description = "Install repository tools, project environments, and Git hooks"
run = [
  "mise install --locked",
  "mise run simulator:setup",
  "mise run gateway:setup",
  "mise run hooks:install",
]

[tasks."simulator:setup"]
description = "Install the simulator development environment"
run = "mise run //tools/simulator:setup"

[tasks."simulator:run"]
description = "Run the simulator CLI"
raw_args = true
run = "mise run //tools/simulator:run"

[tasks."simulator:format"]
description = "Format the simulator"
run = "mise run //tools/simulator:format"

[tasks."simulator:format-check"]
description = "Check simulator formatting"
run = "mise run //tools/simulator:format-check"

[tasks."simulator:lint"]
description = "Lint the simulator"
run = "mise run //tools/simulator:lint"

[tasks."simulator:typecheck"]
description = "Type-check the simulator"
run = "mise run //tools/simulator:typecheck"

[tasks."simulator:test"]
description = "Test the simulator"
run = "mise run //tools/simulator:test"

[tasks."simulator:check"]
description = "Run all simulator checks"
run = "mise run //tools/simulator:check"

[tasks."simulator:experiment:vibration"]
description = "Generate EXP-0001 vibration plots and summaries"
run = "mise run //tools/simulator:experiment:vibration"

[tasks."simulator:experiment:conditions"]
description = "Generate EXP-0002 condition comparison plots and summaries"
run = "mise run //tools/simulator:experiment:conditions"

[tasks.format]
description = "Format all current projects"
run = ["mise run python:format", "mise run gateway:format"]

[tasks.format-check]
description = "Check formatting for all current projects"
run = ["mise run python:format-check", "mise run gateway:format-check"]

[tasks.lint]
description = "Lint all current projects"
run = ["mise run python:lint", "mise run gateway:lint"]

[tasks.typecheck]
description = "Type-check all current projects"
run = ["mise run python:typecheck", "mise run gateway:typecheck"]

[tasks.test]
description = "Test all current projects"
run = ["mise run simulator:test", "mise run gateway:test", "mise run infra:test", "mise run gateway:test:integration", "mise run containers:test"]

[tasks.check]
description = "Run all current repository checks"
run = [
  "mise run python:check",
  "mise run simulator:test",
  "mise run gateway:check",
  "mise run pixi:lock-check",
  "mise run infra:check",
  "mise run containers:check",
]

[tasks."infra:check"]
description = "Validate broker and application Compose configurations (no daemon needed)"
run = [
  "docker compose --file infra/docker/compose.yaml config --quiet",
  "docker compose --file compose.yaml --profile tools config --quiet",
]

[tasks."infra:up"]
description = "Start local MQTT and Kafka services and wait for readiness"
run = "docker compose --file infra/docker/compose.yaml up --detach --wait --wait-timeout 180"

[tasks."infra:down"]
description = "Stop local infrastructure, preserving its data volumes"
run = "docker compose --file infra/docker/compose.yaml down"

[tasks."infra:status"]
description = "Show local infrastructure service and health state"
run = "docker compose --file infra/docker/compose.yaml ps --all"

[tasks."infra:logs"]
description = "Show recent local infrastructure logs"
run = "docker compose --file infra/docker/compose.yaml logs --tail 100"

[tasks."infra:test"]
description = "Prove MQTT session and Kafka record persistence in disposable services"
run = "bash infra/docker/broker-smoke-test.sh"

[tasks."containers:test"]
description = "Build and verify the container workflow in a disposable Compose project"
run = "bash infra/docker/smoke-test.sh"

[tasks."python:format"]
description = "Format repository Python sources"
run = "mise exec -- pixi run --manifest-path pixi.toml --locked -e dev ruff format --config ruff.toml ."

[tasks."python:format-check"]
description = "Check repository Python formatting"
run = "mise exec -- pixi run --manifest-path pixi.toml --locked -e dev ruff format --check --config ruff.toml ."

[tasks."python:lint"]
description = "Lint repository Python sources"
run = "mise exec -- pixi run --manifest-path pixi.toml --locked -e dev ruff check --config ruff.toml ."

[tasks."python:typecheck"]
description = "Type-check all configured Python source directories"
run = "mise exec -- pixi run --manifest-path pixi.toml --locked -e dev mypy --config-file mypy.ini"

[tasks."python:check"]
description = "Check repository Python formatting, lint, and strict types"
run = ["mise run python:format-check", "mise run python:lint", "mise run python:typecheck"]

[tasks."containers:check"]
description = "Check smoke-test shell syntax without starting Docker"
run = [
  "bash -n infra/docker/smoke-test.sh",
  "bash -n infra/docker/broker-smoke-test.sh",
]

[tasks."pixi:lock-check"]
description = "Check that the root Pixi lockfile is current"
run = "mise exec -- pixi lock --check --manifest-path pixi.toml"

[tasks."hooks:install"]
description = "Install the repository's prek Git hook"
run = "mise exec -- prek install"

[tasks."hooks:check"]
description = "Run all configured repository hooks across all files"
run = "mise exec -- prek run --all-files"

[tasks."gateway:setup"]
description = "Download the gateway's pinned Go dependencies"
run = "mise run //services/telemetry-gateway:setup"

[tasks."gateway:run"]
description = "Run the gateway in observation mode"
raw_args = true
run = "mise run //services/telemetry-gateway:run"

[tasks."gateway:format"]
description = "Format the Go gateway"
run = "mise run //services/telemetry-gateway:format"

[tasks."gateway:format-check"]
description = "Check Go gateway formatting"
run = "mise run //services/telemetry-gateway:format-check"

[tasks."gateway:lint"]
description = "Vet the Go gateway"
run = "mise run //services/telemetry-gateway:lint"

[tasks."gateway:typecheck"]
description = "Compile the Go gateway"
run = "mise run //services/telemetry-gateway:typecheck"

[tasks."gateway:test"]
description = "Test the Go gateway with the race detector"
run = "mise run //services/telemetry-gateway:test"

[tasks."gateway:test:integration"]
description = "Verify gateway MQTT behavior against a disposable broker"
run = "mise run //services/telemetry-gateway:test:integration"

[tasks."gateway:check"]
description = "Check Go gateway formatting, vet, build, dependencies, and tests"
run = "mise run //services/telemetry-gateway:check"
