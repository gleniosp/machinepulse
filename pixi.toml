[workspace]
name = "machinepulse"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
requires-pixi = ">=0.76.1,<0.77"

[workspace.dependencies]
python = ">=3.13,<3.14"

[dependencies]
python = { workspace = true }

[pypi-dependencies]
machinepulse_simulator = { path = "tools/simulator", editable = true }

[feature.dev.pypi-dependencies]
mypy = ">=1.14,<2"
pytest = ">=8,<10"
ruff = ">=0.14,<0.15"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
