[workspace]
name = "machinepulse"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64", "linux-aarch64"]
requires-pixi = ">=0.83.0,<0.84"

[workspace.dependencies]
python = ">=3.13,<3.14"

[dependencies]
python = { workspace = true }

[pypi-dependencies]
machinepulse_simulator = { path = "tools/simulator", editable = true }

[feature.dev.pypi-dependencies]
commitizen = ">=4.19.3,<5"
mypy = ">=1.14,<2"
pytest = ">=8,<10"
ruff = ">=0.14,<0.15"

[feature.dev.tasks]
commit-check = "cz check --allow-abort --commit-msg-file"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }
