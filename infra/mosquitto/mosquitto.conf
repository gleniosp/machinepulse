# Local development only; Compose publishes this listener on host loopback.
listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/
# Periodic snapshots plus a final snapshot on graceful shutdown.
autosave_interval 1
autosave_on_changes false

# Bound offline queues; session expiry is requested by each MQTT 5 client.
max_queued_messages 1000
max_queued_bytes 67108864
log_dest stdout
